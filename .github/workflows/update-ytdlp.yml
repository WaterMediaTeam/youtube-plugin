name: Update yt-dlp

# Weekly check for a new yt-dlp release. On a new version: refresh the bundled manifest (version +
# per-platform SHA-256), bump the mod version, commit, tag, and trigger build-release.yml to publish the
# new build to CurseForge + Modrinth. yt-dlp releases often; the runtime pins the floor for fresh installs.
on:
  schedule:
    - cron: "17 6 * * 1"   # MONDAYS 06:17 UTC (ODD MINUTE — GH DELAYS ON-THE-HOUR CRONS)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MANIFEST: src/main/resources/ytdlp/manifest.json
    steps:
      - uses: actions/checkout@v4

      - name: Check for a newer yt-dlp release
        id: check
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo yt-dlp/yt-dlp --json tagName -q .tagName)
          CURRENT=$(jq -r .version "$MANIFEST")
          echo "latest=$LATEST current=$CURRENT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          [ "$LATEST" != "$CURRENT" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Update manifest + bump mod version
        id: bump
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          LATEST="${{ steps.check.outputs.latest }}"
          curl -fsSL -o SUMS "https://github.com/yt-dlp/yt-dlp/releases/download/$LATEST/SHA2-256SUMS"
          hash() { grep -E "  $1\$" SUMS | cut -d' ' -f1; }
          jq --arg v "$LATEST" \
             --arg winx   "$(hash yt-dlp.exe)" \
             --arg winarm "$(hash yt-dlp_arm64.exe)" \
             --arg linx   "$(hash yt-dlp_linux)" \
             --arg linarm "$(hash yt-dlp_linux_aarch64)" \
             --arg mac    "$(hash yt-dlp_macos)" \
             '.version=$v
              | .assets["windows-x86_64"].sha256  = $winx
              | .assets["windows-aarch64"].sha256 = $winarm
              | .assets["linux-x86_64"].sha256    = $linx
              | .assets["linux-aarch64"].sha256   = $linarm
              | .assets["macos"].sha256           = $mac' \
             "$MANIFEST" > manifest.tmp && mv manifest.tmp "$MANIFEST"
          rm -f SUMS

          # BUMP THE TRAILING NUMBER OF version=3.0.0-beta.N
          OLD=$(grep -E '^version=' gradle.properties | cut -d= -f2-)
          N=$(echo "$OLD" | grep -oE '[0-9]+$')
          NEW="${OLD%$N}$((N + 1))"
          sed -i "s|^version=.*|version=$NEW|" gradle.properties
          echo "newversion=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and trigger release
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" gradle.properties
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          NEW="${{ steps.bump.outputs.newversion }}"
          git commit -m "chore(ci): yt-dlp ${{ steps.check.outputs.latest }} + bump to $NEW"
          git push
          git tag "$NEW"
          git push origin "$NEW"
          # build-release.yml has workflow_dispatch; run it on the new tag (the bumped tree) to publish
          gh workflow run build-release.yml --ref "$NEW"
